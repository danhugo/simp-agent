[tool.uv.workspace]
members = ["packages/simp_agent", "apps/cli", "apps/server"]

[tool.uv.sources]
simp-agent = { workspace = true }
simp-cli = { workspace = true }
simp-server = { workspace = true }

[dependency-groups]
dev = [
    "simp-agent",
    "simp-cli",
    "simp-server",
    "pyte>=0.8.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["packages/simp_agent/tests", "apps/cli/tests", "apps/server", "evals"]
