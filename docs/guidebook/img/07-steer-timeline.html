<g font-size="14" fill="#0f172a">
 <rect x="30" y="590" width="1530" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
 <circle cx="52" cy="613" r="6" fill="#d97706"/><text x="66" y="618"><tspan font-weight="700">Steer</tspan>: typed while <tspan class="mono">read README.md</tspan> runs. The tool is not cut. It waits in the steering queue until <tspan font-weight="700">turn_end</tspan>, then enters the history at the START of turn 2 as [4], right after the tool result [3].</text>
 <circle cx="52" cy="648" r="6" fill="#7c3aed"/><text x="66" y="653"><tspan font-weight="700">Follow-up</tspan>: typed while the model is answering in turn 3. It waits until the agent WOULD stop (turn 3 has no tool calls and no steer), then enters as [8] and starts turn 4.</text>
 <circle cx="52" cy="683" r="6" fill="#0284c7"/><text x="66" y="688">Typing time ≠ entering time: a queued message reaches the model only at the next safe point, when every tool call already has its result.</text>
 <circle cx="52" cy="716" r="6" fill="#64748b"/><text x="66" y="721">All of this is ONE run: one agent_start … one agent_end · 5 turns · 11 messages.</text>
