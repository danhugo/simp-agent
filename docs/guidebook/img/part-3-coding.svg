<text x="785.0" y="752.0" font-size="11.5" fill="#0f172a" font-weight="normal" text-anchor="middle" font-family="Menlo, monospace">path</text>
<line x1="1110" y1="762" x2="1300" y2="762" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
<rect x="1164.6" y="737.0" width="80.8" height="22" rx="6" fill="#fff" stroke="#cbd5e1"/>
<text x="1205.0" y="752.0" font-size="11.5" fill="#0f172a" font-weight="normal" text-anchor="middle" font-family="Menlo, monospace">safe Path</text>
