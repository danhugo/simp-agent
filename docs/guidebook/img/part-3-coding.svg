<line x1="1300" y1="980" x2="690" y2="840" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
<rect x="943.8" y="885.0" width="102.4" height="22" rx="6" fill="#fff" stroke="#cbd5e1"/>
<text x="995.0" y="900.0" font-size="11.5" fill="#0f172a" font-weight="normal" text-anchor="middle" font-family="Menlo, monospace">short string</text>
<line x1="640" y1="655" x2="1060" y2="460" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)" stroke-dasharray="6 5"/>
<text x="900" y="600" font-size="12" fill="#16a34a" font-weight="700" text-anchor="start">string → ToolResultMessage → loop</text>
<rect x="1300" y="125" width="500" height="470" rx="18" fill="#fefce8" stroke="#ca8a04" stroke-width="2" filter="url(#s)"/>
<text x="1550" y="155" font-size="15" fill="#a16207" font-weight="700" text-anchor="middle">EVAL  — measures the whole agent</text>
<rect x="1310" y="175" width="235" height="215" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2" filter="url(#s)"/>
<circle cx="1427.5" cy="203" r="16" fill="#2563eb"/>
<text x="1427.5" y="209" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">8</text>
<text x="1427.5" y="243" font-size="16" fill="#1e3a8a" font-weight="700" text-anchor="middle">Run one task</text>
<text x="1427.5" y="265" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="middle">Temp folder + setup files,</text>
<text x="1427.5" y="282" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="middle">AgentSession on prompt,</text>
<text x="1427.5" y="299" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="middle">count turns, run check.</text>
<text x="1322" y="325" font-size="11" fill="#2563eb" font-weight="700" text-anchor="start">IN</text>
<text x="1352" y="325" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start">task (TOML)</text>
<text x="1322" y="343" font-size="11" fill="#2563eb" font-weight="700" text-anchor="start">OUT</text>
<text x="1352" y="343" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start">result row</text>
<rect x="1320" y="355" width="215" height="24" rx="12" fill="#f5f3ff"/>
<text x="1330" y="372" font-size="11.5" fill="#7c3aed" font-weight="700" text-anchor="start">Ch12</text>
<text x="1370" y="372" font-size="11" fill="#5b21b6" font-weight="normal" text-anchor="start" font-family="Menlo, monospace">run_task()</text>
<rect x="1555" y="175" width="235" height="215" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2" filter="url(#s)"/>
<circle cx="1672.5" cy="203" r="16" fill="#2563eb"/>
<text x="1672.5" y="209" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">9</text>
<text x="1672.5" y="243" font-size="16" fill="#1e3a8a" font-weight="700" text-anchor="middle">Report</text>
<text x="1672.5" y="265" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="middle">Print the table and</text>
<text x="1672.5" y="282" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="middle">total, save JSON in</text>
<text x="1672.5" y="299" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="middle">evals/results/.</text>
<text x="1567" y="325" font-size="11" fill="#2563eb" font-weight="700" text-anchor="start">IN</text>
<text x="1597" y="325" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start">result rows</text>
<text x="1567" y="343" font-size="11" fill="#2563eb" font-weight="700" text-anchor="start">OUT</text>
<text x="1597" y="343" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start">table + JSON</text>
<rect x="1565" y="355" width="215" height="24" rx="12" fill="#f5f3ff"/>
<text x="1575" y="372" font-size="11.5" fill="#7c3aed" font-weight="700" text-anchor="start">Ch12</text>
<text x="1615" y="372" font-size="11" fill="#5b21b6" font-weight="normal" text-anchor="start" font-family="Menlo, monospace">run_all()</text>
