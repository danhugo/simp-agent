<text x="1210.0" y="320.0" font-size="11.5" fill="#0f172a" font-weight="normal" text-anchor="middle" font-family="Menlo, monospace">runs AgentSession</text>
<text x="1550" y="430" font-size="12" fill="#713f12" font-weight="normal" text-anchor="middle" font-family="Menlo, monospace">fix_bug.toml:  prompt = "Fix the bug in calc.py"</text>
<text x="1550" y="452" font-size="12" fill="#713f12" font-weight="normal" text-anchor="middle" font-family="Menlo, monospace">check = pytest test_calc.py   (exit 0 = PASS)</text>
