<text x="665" y="220" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="middle">Once: context file,</text>
<text x="665" y="237" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="middle">plugin setup(),</text>
<text x="665" y="254" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="middle">session_start.</text>
