<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1060" viewBox="0 0 1840 1060" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><filter id="s" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/></filter></defs>
<rect width="1840" height="1060" fill="#f8fafc"/>
<text x="920" y="44" font-size="28" fill="#0f172a" font-weight="700" text-anchor="middle">The session block of simp-agent — one complete picture</text>
<text x="920" y="72" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">Blocks = what happens.  Cards on the arrows = the data passed between steps.  Purple tags = book chapter + code.</text>
<text x="220" y="110" font-size="15" fill="#2563eb" font-weight="700" text-anchor="start">GOING IN  →  the task, and each model turn is prepared</text>
<text x="220" y="560" font-size="15" fill="#16a34a" font-weight="700" text-anchor="start">←  COMING BACK  —  tools run, messages are saved, errors are fixed</text>
<rect x="30" y="125" width="170" height="890" rx="18" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5" filter="url(#s)"/>
<text x="115" y="165" font-size="20" fill="#312e81" font-weight="700" text-anchor="middle">The App</text>
<text x="115" y="190" font-size="13" fill="#4338ca" font-weight="normal" text-anchor="middle">(CLI / server)</text>
<text x="115" y="240" font-size="13" fill="#3730a3" font-weight="700" text-anchor="middle">Gives:</text>
<text x="115" y="260" font-size="13" fill="#3730a3" font-weight="normal" text-anchor="middle">profile dict</text>
<text x="115" y="280" font-size="13" fill="#3730a3" font-weight="normal" text-anchor="middle">plugin names</text>
<text x="115" y="300" font-size="13" fill="#3730a3" font-weight="normal" text-anchor="middle">store</text>
<text x="115" y="320" font-size="13" fill="#3730a3" font-weight="normal" text-anchor="middle">task text</text>
<text x="115" y="640" font-size="13" fill="#3730a3" font-weight="700" text-anchor="middle">Gets back:</text>
<text x="115" y="660" font-size="13" fill="#3730a3" font-weight="normal" text-anchor="middle">events (live)</text>
<text x="115" y="680" font-size="13" fill="#3730a3" font-weight="normal" text-anchor="middle">new messages</text>
<text x="115" y="700" font-size="13" fill="#3730a3" font-weight="normal" text-anchor="middle">lines in store</text>
<rect x="45" y="975" width="140" height="24" rx="12" fill="#f5f3ff"/>
<text x="115" y="992" font-size="11.5" fill="#7c3aed" font-weight="700" text-anchor="middle">Ch19 CLI · Ch20</text>
<rect x="1640" y="125" width="170" height="890" rx="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1725" y="430" font-size="20" fill="#475569" font-weight="700" text-anchor="middle">Agent loop</text>
<text x="1725" y="456" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">model call,</text>
<text x="1725" y="474" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">run tools,</text>
<text x="1725" y="492" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">repeat</text>
<text x="1725" y="530" font-size="15" fill="#475569" font-weight="700" text-anchor="middle">→ Part 2</text>
<text x="1725" y="550" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">(ch05–08)</text>
