<circle cx="1225" cy="158" r="16" fill="#2563eb"/>
<text x="1225" y="164" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">4</text>
<text x="1225" y="198" font-size="16" fill="#1e3a8a" font-weight="700" text-anchor="middle">Prepare view</text>
<text x="1225" y="220" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="middle">Too big? compact.</text>
<text x="1225" y="237" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="middle">build_view, then</text>
<text x="1225" y="254" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="middle">plugin context hooks.</text>
<text x="1122" y="283" font-size="11" fill="#2563eb" font-weight="700" text-anchor="start">IN</text>
<text x="1152" y="283" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start">full history</text>
