<text x="842" y="283" font-size="11" fill="#2563eb" font-weight="700" text-anchor="start">IN</text>
<text x="872" y="283" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start">task text</text>
<text x="842" y="301" font-size="11" fill="#2563eb" font-weight="700" text-anchor="start">OUT</text>
<text x="872" y="301" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start">text + extra</text>
<rect x="840" y="324" width="210" height="24" rx="12" fill="#f5f3ff"/>
