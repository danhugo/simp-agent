# Production: docker compose up -d. Home (settings.toml, .env, simp.db) is $SIMP_HOME on the host (default /srv/simp).
x-logging: &logging {driver: json-file, options: {max-size: 10m, max-file: "3"}}  # docker keeps all logs otherwise

services:
  server:
    build: {context: ., target: server}
    restart: always
    logging: *logging
    volumes: ["${SIMP_HOME:-/srv/simp}:/data"]
  google_mcp:
    build: {context: ., target: server}
    restart: always
    logging: *logging
    command: ["python", "-m", "simp_server.google_mcp"]
    network_mode: "service:server"  # server reaches it on 127.0.0.1:8101-8103 (connections.APPS default urls)
    volumes: ["${SIMP_HOME:-/srv/simp}:/data"]
  caddy:
    build: {context: ., target: web}
    restart: always
    logging: *logging
    ports: ["80:80", "443:443"]
    environment: [DOMAIN]
    volumes: [caddy_data:/data]
volumes:
  caddy_data:  # HTTPS certificates
