[project]
name = "simp-server"
version = "0.1.0"
description = "HTTP server for simp-agent (skeleton)"
requires-python = ">=3.13"
dependencies = [
    "simp-agent",
    "fastapi",
]

[tool.uv.sources]
simp-agent = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
