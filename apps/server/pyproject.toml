[project]
name = "simp-server"
version = "0.1.0"
description = "HTTP server for simp-agent (skeleton)"
requires-python = ">=3.13"
dependencies = [
    "simp-agent[mcp,images]",
    "fastapi",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "aiosqlite>=0.22.1",
    "cryptography>=50.0.2",
    "boto3>=1.44.3",
    "e2b>=2.64.0",
    "sentry-sdk[fastapi]>=2.75.0",
]

[tool.uv.sources]
simp-agent = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[project.scripts]
simp-server = "simp_server.__main__:main"
